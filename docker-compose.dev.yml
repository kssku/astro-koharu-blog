version: '3.8'

services:
  astro-koharu-dev:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NODE_USE_ENV_PROXY=1
      - HTTP_PROXY=http://host.docker.internal:7890
      - HTTPS_PROXY=http://host.docker.internal:7890
    command: sh -c "corepack enable && corepack prepare pnpm@10.28.2 --activate && pnpm install && pnpm dev --host 0.0.0.0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
