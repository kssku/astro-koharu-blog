<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160">
  <defs>
    <!-- 文字渐变（粉→紫） -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1493" />
      <stop offset="100%" stop-color="#8A2BE2" />
    </linearGradient>
    <!-- 外发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 背景已移除，完全透明 -->

  <!-- 装饰性线条（左右对称） -->
  <path d="M 50 40 L 120 40 L 160 80 L 120 120 L 50 120" fill="none" stroke="#FF69B4" stroke-width="2" opacity="0.4" />
  <path d="M 450 40 L 380 40 L 340 80 L 380 120 L 450 120" fill="none" stroke="#FF69B4" stroke-width="2" opacity="0.4" />

  <!-- 装饰星星（四角） -->
  <text x="70" y="35" font-size="20" fill="#FF69B4" opacity="0.6">✦</text>
  <text x="430" y="35" font-size="20" fill="#FF69B4" opacity="0.6">✦</text>
  <text x="70" y="125" font-size="20" fill="#FF69B4" opacity="0.6">✦</text>
  <text x="430" y="125" font-size="20" fill="#FF69B4" opacity="0.6">✦</text>

  <!-- 主文字 -->
  <text x="250" y="95" font-family="'Arial Black', 'Impact', 'Comic Sans MS', sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="6">
    Redchen
  </text>

  <!-- 文字下方装饰线 -->
  <line x1="150" y1="118" x2="350" y2="118" stroke="#FF69B4" stroke-width="2" opacity="0.6" />
  <line x1="180" y1="124" x2="320" y2="124" stroke="#DDA0DD" stroke-width="1.5" opacity="0.4" />

  <!-- 底部小标签 -->
  <text x="250" y="138" font-family="'Chill Round', 'PingFang SC', sans-serif" font-size="12" fill="#8A2BE2" opacity="0.5" text-anchor="middle" letter-spacing="4">
    ✦ 红尘笑的小窝 ✦
  </text>
</svg>