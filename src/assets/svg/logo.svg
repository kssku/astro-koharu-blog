<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="500" height="150">
  <defs>
    <!-- 亮樱花粉渐变 -->
    <linearGradient id="brightSakura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB7C5" />
      <stop offset="50%" stop-color="#FF6B9D" />
      <stop offset="100%" stop-color="#FF4080" />
    </linearGradient>
  </defs>

  <!-- 整体向左移动：X 从 -10 改为 -30 -->
  <g transform="translate(-500, 5) scale(1.6)">
    <!-- 使用 Chill Round 圆体 + Comic Sans 作为备选 -->
    <text x="10" y="85" font-family="'Chill Round', 'Comic Sans MS', 'PingFang SC', cursive" font-size="64" font-weight="bold" fill="url(#brightSakura)" stroke="#000000" stroke-width="0.8" transform="rotate(3, 10, 85)">R</text>
    <text x="55" y="85" font-family="'Chill Round', 'Comic Sans MS', 'PingFang SC', cursive" font-size="64" font-weight="bold" fill="url(#brightSakura)" stroke="#000000" stroke-width="0.8" transform="rotate(3, 55, 85)">e</text>
    <text x="95" y="85" font-family="'Chill Round', 'Comic Sans MS', 'PingFang SC', cursive" font-size="64" font-weight="bold" fill="url(#brightSakura)" stroke="#000000" stroke-width="0.8" transform="rotate(3, 95, 85)">d</text>
    <text x="138" y="85" font-family="'Chill Round', 'Comic Sans MS', 'PingFang SC', cursive" font-size="64" font-weight="bold" fill="url(#brightSakura)" stroke="#000000" stroke-width="0.8" transform="rotate(3, 138, 85)">c</text>
    <text x="175" y="85" font-family="'Chill Round', 'Comic Sans MS', 'PingFang SC', cursive" font-size="64" font-weight="bold" fill="url(#brightSakura)" stroke="#000000" stroke-width="0.8" transform="rotate(3, 175, 85)">h</text>
    <text x="218" y="85" font-family="'Chill Round', 'Comic Sans MS', 'PingFang SC', cursive" font-size="64" font-weight="bold" fill="url(#brightSakura)" stroke="#000000" stroke-width="0.8" transform="rotate(3, 218, 85)">e</text>
    <text x="260" y="85" font-family="'Chill Round', 'Comic Sans MS', 'PingFang SC', cursive" font-size="64" font-weight="bold" fill="url(#brightSakura)" stroke="#000000" stroke-width="0.8" transform="rotate(3, 260, 85)">n</text>
  </g>
</svg>