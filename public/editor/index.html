<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客文章编辑器</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 { font-size: 24px; margin-top: 0; margin-bottom: 20px; }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      align-items: center;
    }
    .toolbar select {
      padding: 8px 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      font-size: 14px;
      flex: 1;
      min-width: 200px;
    }
    .toolbar button {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      background: #2da44e;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toolbar button:hover:not(:disabled) { background: #22863a; }
    .toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }
    .toolbar button.secondary {
      background: #f0f2f5;
      color: #24292f;
    }
    .toolbar button.secondary:hover { background: #e1e4e8; }
    .status {
      font-size: 14px;
      color: #57606a;
      margin: 8px 0 12px;
      padding: 8px 12px;
      border-radius: 6px;
      background: #f6f8fa;
    }
    .status.error { color: #cf222e; background: #ffebe9; }
    .status.success { color: #1a7f37; background: #dafbe1; }
    #auth-status {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    #auth-status button {
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      background: #24292f;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }
    #auth-status button:hover { background: #1b1f23; }
    .editor-wrapper .EasyMDEContainer { border-radius: 6px; border: 1px solid #d0d7de; }
    .editor-wrapper .CodeMirror { min-height: 400px; }
    .login-loading { color: #57606a; font-size: 14px; }
  </style>
</head>
<body>
<div class="container">
  <h1>📝 博客文章编辑器</h1>

  <!-- 登录区域 -->
  <div id="auth-status">
    <button id="login-btn">登录 GitHub</button>
    <span id="login-status" class="login-loading"></span>
  </div>

  <!-- 编辑器区域 -->
  <div id="editor-area" style="display:none;">
    <div class="toolbar">
      <select id="file-select">
        <option value="">— 请选择文章 —</option>
      </select>
      <button id="save-btn" disabled>💾 保存并推送</button>
      <button id="refresh-btn" class="secondary">🔄 刷新列表</button>
    </div>
    <div id="status-msg" class="status">准备就绪</div>
    <div class="editor-wrapper">
      <textarea id="markdown-editor"></textarea>
    </div>
  </div>
</div>

<!-- 依赖库 -->
<script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>

<script>
  (function() {
    // --- 配置（请根据实际情况修改） ---
    const GITHUB_CLIENT_ID = 'Ov23liSDJSV9SjcxKlXI';
    const BASE_URL = 'https://blog.kssku.top';
    const REPO_OWNER = 'kssku';
    const REPO_NAME = 'astro-koharu-blog';
    const BRANCH = 'main';
    const CONTENT_PATH = 'src/content/blog';

    // --- DOM 引用 ---
    const loginBtn = document.getElementById('login-btn');
    const loginStatus = document.getElementById('login-status');
    const editorArea = document.getElementById('editor-area');
    const authStatus = document.getElementById('auth-status');
    const fileSelect = document.getElementById('file-select');
    const saveBtn = document.getElementById('save-btn');
    const refreshBtn = document.getElementById('refresh-btn');
    const statusMsg = document.getElementById('status-msg');
    const textarea = document.getElementById('markdown-editor');

    let accessToken = null;
    let currentFile = null;
    let easyMDE = null;

    // --- 工具函数 ---
    function setStatus(msg, type = '') {
      statusMsg.textContent = msg;
      statusMsg.className = 'status ' + type;
    }

    function setLoginStatus(msg, type = '') {
      loginStatus.textContent = msg;
      loginStatus.className = 'login-loading ' + type;
    }

    // --- 登录 ---
    function login() {
      const redirectUri = BASE_URL + '/oauth/github';
      const url = 'https://github.com/login/oauth/authorize' +
        '?client_id=' + GITHUB_CLIENT_ID +
        '&redirect_uri=' + encodeURIComponent(redirectUri) +
        '&scope=repo';
      window.location.href = url;
    }

    // --- 处理 OAuth 回调 ---
    async function handleOAuthCallback() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      if (!code) {
        // 没有 code，检查是否已登录
        const saved = localStorage.getItem('github_token');
        if (saved) {
          accessToken = saved;
          await initEditorApp();
        }
        return;
      }

      setLoginStatus('正在获取授权令牌...', '');
      try {
        const resp = await axios.get(BASE_URL + '/oauth/github?code=' + code);
        const data = resp.data;
        if (data.access_token) {
          accessToken = data.access_token;
          localStorage.setItem('github_token', accessToken);
          // 去掉 URL 中的 code 参数
          window.history.replaceState({}, document.title, window.location.pathname);
          await initEditorApp();
        } else {
          setLoginStatus('授权失败: ' + (data.error || '未知错误'), 'error');
        }
      } catch (err) {
        setLoginStatus('获取令牌失败: ' + err.message, 'error');
      }
    }

    // --- 初始化编辑器 ---
    async function initEditorApp() {
      try {
        // 验证 token
        const userResp = await axios.get('https://api.github.com/user', {
          headers: { Authorization: 'token ' + accessToken }
        });
        setLoginStatus('已登录: ' + userResp.data.login, 'success');
        authStatus.style.display = 'none';
        editorArea.style.display = 'block';

        // 加载文章列表
        await loadFileList();
        initEasyMDE();

      } catch (err) {
        setLoginStatus('登录验证失败: ' + err.message, 'error');
        localStorage.removeItem('github_token');
        accessToken = null;
        authStatus.style.display = 'flex';
        editorArea.style.display = 'none';
      }
    }

    // --- 加载文章列表（递归遍历子目录） ---
    async function loadFileList() {
      setStatus('加载文章列表...', '');
      try {
        const baseUrl = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + CONTENT_PATH + '?ref=' + BRANCH;
        const resp = await axios.get(baseUrl, {
          headers: { Authorization: 'token ' + accessToken }
        });
        const files = [];
        const items = resp.data;

        for (const item of items) {
          if (item.type === 'file' && item.name.endsWith('.md')) {
            files.push(item);
          } else if (item.type === 'dir') {
            const subResp = await axios.get(item.url, {
              headers: { Authorization: 'token ' + accessToken }
            });
            for (const sub of subResp.data) {
              if (sub.type === 'file' && sub.name.endsWith('.md')) {
                files.push(sub);
              }
            }
          }
        }

        // 按路径排序
        files.sort((a, b) => a.path.localeCompare(b.path));

        fileSelect.innerHTML = '<option value="">— 请选择文章 —</option>';
        files.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.path;
          // 显示更友好的名称
          const parts = f.path.split('/');
          const fileName = parts[parts.length - 1];
          const dirName = parts.length > 1 ? parts[parts.length - 2] + '/' : '';
          opt.textContent = dirName + fileName;
          fileSelect.appendChild(opt);
        });

        setStatus('加载完成，共 ' + files.length + ' 篇文章', 'success');
      } catch (err) {
        setStatus('加载失败: ' + err.message, 'error');
      }
    }

    // --- 初始化 EasyMDE ---
    function initEasyMDE() {
      if (easyMDE) {
        easyMDE.toTextArea();
        easyMDE = null;
      }
      easyMDE = new EasyMDE({
        element: textarea,
        spellChecker: false,
        toolbar: [
          'bold', 'italic', 'heading', '|',
          'quote', 'code', '|',
          'unordered-list', 'ordered-list', '|',
          'link', 'image', '|',
          'preview', 'side-by-side', 'fullscreen'
        ],
        placeholder: '选择一篇文章后开始编辑...',
        status: false,
        minHeight: '400px'
      });

      // 文件选择事件
      fileSelect.addEventListener('change', async function() {
        const path = this.value;
        if (!path) {
          easyMDE.value('');
          currentFile = null;
          saveBtn.disabled = true;
          return;
        }
        setStatus('加载文章...', '');
        try {
          const url = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + path + '?ref=' + BRANCH;
          const resp = await axios.get(url, {
            headers: { Authorization: 'token ' + accessToken }
          });
          // 解码 Base64 内容
          const content = atob(resp.data.content);
          easyMDE.value(content);
          currentFile = {
            path: path,
            sha: resp.data.sha
          };
          saveBtn.disabled = false;
          setStatus('已加载: ' + path, 'success');
        } catch (err) {
          setStatus('加载文章失败: ' + err.message, 'error');
        }
      });
    }

    // --- 保存并推送 ---
    async function saveAndPush() {
      if (!currentFile) return;
      const content = easyMDE.value();
      // 编码为 Base64
      const encoded = btoa(unescape(encodeURIComponent(content)));

      try {
        setStatus('正在提交...', '');
        const url = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + currentFile.path;
        const payload = {
          message: '更新文章: ' + currentFile.path,
          content: encoded,
          sha: currentFile.sha,
          branch: BRANCH
        };
        await axios.put(url, payload, {
          headers: {
            Authorization: 'token ' + accessToken,
            'Content-Type': 'application/json'
          }
        });
        setStatus('✅ 已成功提交并推送到 GitHub！', 'success');

        // 刷新文件列表（更新 SHA）
        await loadFileList();
        // 重置状态
        saveBtn.disabled = true;
        currentFile = null;
        fileSelect.value = '';
        easyMDE.value('');
      } catch (err) {
        const msg = err.response?.data?.message || err.message;
        setStatus('提交失败: ' + msg, 'error');
      }
    }

    // --- 刷新 ---
    async function refreshList() {
      await loadFileList();
      fileSelect.value = '';
      easyMDE.value('');
      currentFile = null;
      saveBtn.disabled = true;
      setStatus('已刷新', 'success');
    }

    // --- 事件绑定 ---
    loginBtn.addEventListener('click', login);
    saveBtn.addEventListener('click', saveAndPush);
    refreshBtn.addEventListener('click', refreshList);

    // --- 启动 ---
    handleOAuthCallback();

  })();
</script>
</body>
</html>
