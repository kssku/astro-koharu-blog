# =============================================================================
# Site Configuration - 博客配置文件
# =============================================================================
# 修改这个文件可以定制你的博客。
# 修改后需要重新构建: blog-push 或 git push
# =============================================================================

# =============================================================================
# 站点基本信息 - 这里填你博客的名字、描述等
# =============================================================================
site:
  title: "红尘笑的小窝"
  alternate: "hongchenxiao"
  subtitle: "WA 的一声就哭了"
  name: "kssku"
  description: "动漫 · 游戏 · 日常 · 技术"
  avatar: "/img/avatar.webp"
  showLogo: true
  author: "kssku"
  url: "https://blog.kssku.top"
  defaultOgImage: "/img/avatar.webp"
  startYear: 2026
  timezone: "Asia/Shanghai"
  keywords:
    - 二次元
    - 游戏
    - 动漫
    - 随笔
    - 日记

# =============================================================================
# 多语言设置 - 不想用多语言可以只保留中文
# =============================================================================
i18n:
  defaultLocale: zh
  locales:
    - code: zh
      label: 中文

# =============================================================================
# 分类映射 - 重要！决定文章分类的 URL 长什么样
# =============================================================================
categoryMap:
  随笔: life
  日记: diary
  游戏评测: game
  动漫评测: anime
  笔记: note
  前端: front-end

# =============================================================================
# 首页精选分类 - 在首页显示的 4 个分类卡片
# =============================================================================
featuredCategories:
  - link: life
    label: 随笔
    image: /img/cover/2.webp
    description: 日常随想 · 生活记录
  - link: diary
    label: 日记
    image: /img/cover/3.webp
    description: 日常琐事 · 个人日记
  - link: game
    label: 游戏评测
    image: /img/cover/1.webp
    description: 游戏玩后感 · 推荐
  - link: anime
    label: 动漫评测
    image: /img/cover/4.webp
    description: 动漫观后感 · 点评

# =============================================================================
# 系列文章 - 不需要就保持空数组 []
# =============================================================================
featuredSeries: []

# =============================================================================
# 社交链接 - 显示在页脚
# =============================================================================
social:
  github:
    url: https://github.com/kssku
    icon: ri:github-fill
    color: '#191717'
  email:
    url: mailto:598089280@qq.com
    icon: ri:mail-line
    color: '#55acd5'
  rss:
    url: /rss.xml
    icon: ri:rss-line
    color: '#ff6600'

# =============================================================================
# 友链页面
# =============================================================================
friends:
  intro:
    title: 友情链接
    subtitle: 欢迎交换友链！
    applyTitle: 申请友链
    applyDesc: 请在本页留言，格式如下
    exampleYaml: |
      - site: 你的博客名称
        url: https://your-blog.com/
        owner: 你的昵称
        desc: 站点简介
        image: https://your-blog.com/avatar.jpg
        color: "#ffc0cb"
  data: []

# =============================================================================
# 公告系统 - 不需要就保持空数组 []
# =============================================================================
announcements: []

# =============================================================================
# 内容处理选项 - true=启用, false=关闭
# =============================================================================
content:
  addBlankTarget: true
  smoothScroll: true
  addHeadingLevel: true
  enhanceCodeBlock: true
  enableCodeCopy: true
  enableCodeFullscreen: true
  enableLinkEmbed: true
  enableCodePenEmbed: true
  enableTweetEmbed: true
  enableOGPreview: true
  previewCacheTime: 30
  lazyLoadEmbeds: true
  postCardImagePosition: alternating
  enableShokaContainers: true
  enableShokaAttrs: true
  enableShokaEffects: true
  enableShokaSpoiler: true
  enableShokaRuby: true
  enableShokaHexoTags: true
  enableMath: true
  enableCodeMeta: true
  enableQuiz: true
  enableEncryptedBlock: true

# =============================================================================
# 碎碎念 - 暂时关闭
# =============================================================================
moments:
  enabled: false

# =============================================================================
# 导航菜单 - 顶部导航栏
# =============================================================================
navigation:
  - name: 首页
    nameKey: nav.home
    path: /
    icon: ri:home-heart-fill
  - name: 随笔
    path: /categories/life
    icon: ri:book-line
  - name: 游戏
    path: /categories/game
    icon: ri:gamepad-line
  - name: 动漫
    path: /categories/anime
    icon: ri:film-line
  - name: 文章
    nameKey: nav.posts
    icon: ri:quill-pen-ai-fill
    children:
      - name: 分类
        nameKey: nav.categories
        path: /categories
        icon: ri:grid-fill
      - name: 标签
        nameKey: nav.tags
        path: /tags
        icon: fa6-solid:tags
      - name: 归档
        nameKey: nav.archives
        path: /archives
        icon: ri:archive-2-fill
  - name: 关于
    nameKey: nav.about
    path: /about
    icon: fa6-regular:circle-user

# =============================================================================
# 圣诞特效 - 关闭
# =============================================================================
christmas:
  enabled: false

# =============================================================================
# 评论系统 - Giscus
# =============================================================================
comment:
  provider: giscus
  giscus:
    repo: kssku/kssku-blog
    repoId: R_kgDOTyJXeQ
    category: Announcements
    categoryId: DIC_kwDOTyJXec4DC7qg
    mapping: pathname
    reactionsEnabled: '1'
    emitMetadata: '0'
    inputPosition: bottom
    lang: zh-CN

# =============================================================================
# 数据统计 - 关闭
# =============================================================================
analytics:
  umami:
    enabled: false

# =============================================================================
# SEO 配置
# =============================================================================
seo:
  robots: {}

# =============================================================================
# 背景音乐
# =============================================================================
bgm:
  enabled: true
  audio:
    - title: 博客背景音乐
      list:
        - https://music.163.com/playlist?id=17889296286

# =============================================================================
# 追番 - Bangumi
# =============================================================================
bangumi:
  userId: kssku

# =============================================================================
# 开发工具 - 本地编辑器跳转
# =============================================================================
dev:
  localProjectPath: '/vol1/1000/docker/astro-koharu'
  contentRelativePath: 'src/content/blog'
  editors:
    - id: vscode
      name: VS Code
      icon: devicon-plain:vscode
      urlTemplate: 'vscode://file/{path}'
    - id: cursor
      name: Cursor
      icon: simple-icons:cursor
      urlTemplate: 'cursor://file/{path}'
    - id: zed
      name: Zed
      icon: simple-icons:zedindustries
      urlTemplate: 'zed://file/{path}'
